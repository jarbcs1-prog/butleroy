[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "butleroy"
version = "0.3.0"
description = "ButlerOY - LocalAIzed Concierge for Windows. A 24/7 assistant that lives on one Windows machine, with all reasoning and all memory on-device."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }

# The core set is deliberately almost empty.
#
# Plane A - the resident daemon, the policy gate, the VRAM arbiter, the audit
# chain, the workspace manifests, the named-pipe transport - is pure stdlib.
# That is not an accident and it is the property D1 rests on: the daemon holds
# the gate with the model dead, which is why 24/7 costs a few hundred MB of RAM
# and no VRAM. Anything that made `import assistant.daemon` pull in a model
# runtime would break that argument at install time, long before anyone noticed.
#
# So the only third-party things the always-on process needs are the tray icon
# and the image it draws itself. `pip install butleroy` is small and instant, and
# it cannot silently become a multi-gigabyte download.
#
# *** llama-cpp-python is NOT here, nor in ANY extra below. ***
# It is NOT in the core dependencies, and it is deliberately not in the `brain`
# extra either. That extra used to list it, and listing it was a bug - see below.
#
# llama-cpp-python 0.3.35 publishes NO wheel on PyPI. One sdist, zero wheels
# (checked against the PyPI JSON API). So naming it as a dependency does not
# install a prebuilt binary; it makes the package manager COMPILE it, using
# llama-cpp-python's own defaults and not our flags. On this machine that
# produced a ggml-cpu.dll at 76.73% EVEX-shaped - AVX-512, which a Ryzen 5 5600G
# (Zen 3) cannot execute. It imports cleanly and then dies with
# STATUS_ILLEGAL_INSTRUCTION on the first real instruction.
#
# Worse, it broke the installer. install.ps1 runs `uv pip install -e .[brain]`
# and deliberately does NOT initialise MSVC (install.ps1:155 - a probe that
# initialised it would mutate the shell's environment). With no wheel to
# download, that install has to compile, and with no compiler it fails:
#   Running 'nmake' '-?' failed: no such file or directory
#   CMake Error: CMAKE_C_COMPILER not set, after EnableLanguage
# Measured on 2026-10-13, deleting .venv and reinstalling from scratch. It had
# only ever "worked" because uv's cache held a wheel from an earlier attempt -
# one built WITHOUT our flags, hence the AVX-512 above. install.ps1 -WithBrain
# was structurally broken on any machine with a cold cache.
#
# So the single flag-controlled path is build_phase0b.bat. It calls vcvars64
# itself, pins CMAKE_CUDA_COMPILER, and passes GGML_NATIVE=OFF, GGML_AVX512=OFF,
# AVX2=ON and CMAKE_CUDA_ARCHITECTURES=86 - the only place those flags exist.
# Nothing that merely names a dependency can reproduce them.
#
# `brain` is kept as an empty extra because install.ps1 passes `.[brain]` and a
# missing extra is a hard error. It is a marker for "Plane B, built separately",
# not a package list. See INSTALL.md and DECISIONS.md D25, D84, D87.
dependencies = [
    "pystray>=0.19",
    "pillow>=10",
]

[project.optional-dependencies]
# Plane B, the local brain. INTENTIONALLY EMPTY - see the long note above.
# Do not add llama-cpp-python here. Installing it as a dependency compiles it
# with the wrong flags, or fails outright on a machine without MSVC on PATH.
# Build it with: .\build_phase0b.bat   then prove it with: verify_install.py
brain = []
# Plane D speech: faster-whisper for STT on CPU/int8, piper for TTS.
voice = [
    "numpy>=1.26",
    "sounddevice>=0.4",
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
]
# The wake word. Built and measured, then abandoned on this machine (D57), but
# the code is kept because the same scorer is what proved it does not fire here.
wakeword = [
    "openwakeword>=0.6",
    "onnxruntime>=1.17",
]
test = [
    "pytest>=8",
]

[project.scripts]
butleroy = "assistant.launcher:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The package is imported from src/ rather than installed, because the install
# of record for this project is INSTALL.md, not pip. Without this the suite
# fails at collection with "No module named assistant" on a fresh checkout -
# which is how 1025 tests once looked like a broken environment rather than a
# missing PYTHONPATH.
pythonpath = ["src"]
testpaths = ["tests"]
